<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chief</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2a313c;--text:#e6e9ee;--muted:#8b95a5;--accent:#5b9dff;--ok:#3fb27f;--warn:#e0a030;--bad:#e5534b;--user:#1f3a63}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#d9dee6;--text:#161b22;--muted:#5b6574;--accent:#1f6feb;--ok:#1a7f55;--warn:#9a6700;--bad:#cf222e;--user:#dbe9ff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill[data-state=running] .dot{background:var(--ok)}
.pill[data-state=finishing] .dot,.pill[data-state=paused] .dot{background:var(--warn)}
.pill[data-state=offline] .dot{background:var(--bad)}
button,select,textarea,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,92%);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--user)}
.msg.note{align-self:center;color:var(--muted);font-size:14px;background:transparent;border-style:dashed}
.msg.error{border-color:var(--bad)}
.msg small{display:block;color:var(--muted);margin-top:6px}
#gate{margin:auto;max-width:460px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
#gate p{margin:0 0 12px;color:var(--muted)}
#gate input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:12px}
code{background:var(--bg);padding:1px 6px;border-radius:4px;border:1px solid var(--line);word-break:break-all}
form{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
form select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:40px}
form input[name=agent]{width:120px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:40px}
form textarea{flex:1 1 100%;order:-1;resize:vertical;min-height:56px;max-height:200px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
form .spacer{margin-right:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>The Chief</h1>
  <span class="pill" id="state" data-state="offline" role="status" aria-live="polite"><span class="dot"></span><span id="stateText">Not connected</span></span>
  <span class="pill" id="load" title="Requests The Chief is forwarding right now">0 / 6 in flight</span>
  <button id="pause" type="button" disabled>Pause work</button>
  <button id="resume" type="button" disabled>Resume work</button>
</header>

<main id="thread" aria-live="polite">
  <section id="gate">
    <p>Paste your intake key to connect. It stays in this browser tab only and is cleared when you close it.</p>
    <p>Find it in <code>%LOCALAPPDATA%\Cheverton\console\chief-intake.key</code></p>
    <input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Intake key" aria-label="Intake key">
    <button id="connect" type="button" class="primary">Connect</button>
  </section>
</main>

<form id="composer" hidden>
  <textarea id="text" name="text" rows="2" placeholder="Ask The Chief, or assign work…" aria-label="Message" maxlength="4000"></textarea>
  <select id="mode" name="mode" aria-label="What to do with this message">
    <option value="chat">Ask (chat)</option>
    <option value="command">Assign as task / command</option>
  </select>
  <input name="agent" id="agent" placeholder="Agent id" aria-label="Agent id (optional, for commands)" maxlength="32" hidden>
  <span class="spacer"></span>
  <button id="send" type="submit" class="primary">Send</button>
</form>

<script>
'use strict';
const $=id=>document.getElementById(id);
const thread=$('thread'),composer=$('composer');
let key=null,history=[],busy=false,pollTimer=null,lastState=null;
try{key=sessionStorage.getItem('chiefKey');}catch{}

function add(text,cls='',meta=''){
  const el=document.createElement('div');
  el.className='msg '+cls;el.textContent=text;
  if(meta){const small=document.createElement('small');small.textContent=meta;el.appendChild(small);}
  thread.appendChild(el);thread.scrollTop=thread.scrollHeight;return el;
}
async function api(path,{method='POST',body}={}){
  const res=await fetch(path,{method,headers:{'x-chief-intake-key':key,'content-type':'application/json'},body:method==='POST'?JSON.stringify(body||{}):undefined});
  let data={};try{data=await res.json();}catch{}
  if(res.status===401){lock('That key was not accepted.');}
  return {status:res.status,data};
}
function lock(message){
  key=null;try{sessionStorage.removeItem('chiefKey');}catch{}
  clearInterval(pollTimer);composer.hidden=true;
  $('gate').hidden=false;thread.prepend($('gate'));
  if(message)add(message,'note error');
  setState('offline','Not connected');$('pause').disabled=$('resume').disabled=true;
}
function setState(state,text){const el=$('state');el.dataset.state=state;$('stateText').textContent=text;}

async function refresh(){
  try{
    const {status,data}=await api('/console/status',{method:'GET'});
    if(status===401)return;
    if(status!==200||!data||data.ok===false&&!data.state){setState('offline','Console unavailable');return;}
    const draining=Boolean(data.draining);
    const state=data.state==='ready-to-restart'?['paused','Paused, idle']:draining?['finishing','Pausing, finishing work']:['running','Running'];
    setState(state[0],state[1]);lastState=state[0];
    $('pause').disabled=draining;$('resume').disabled=!draining;
    $('state').title=data.message||'';
  }catch{setState('offline','The Chief is not reachable');}
  try{
    const res=await fetch('/status');const s=await res.json();
    if(s.intake)$('load').textContent=`${s.intake.inFlight} / ${s.intake.maxInFlight} in flight`+(s.intake.tripped?' · stopped':'');
  }catch{}
}
function connect(){
  composer.hidden=false;$('gate').hidden=true;
  add('Connected. Ask a question, or switch to "Assign as task / command" to start work.','note');
  refresh();pollTimer=setInterval(refresh,5000);
}
$('connect').addEventListener('click',()=>{
  const value=$('keyInput').value.trim();
  if(!/^[A-Za-z0-9_-]{43}$/.test(value)){add('That does not look like an intake key.','note error');return;}
  key=value;$('keyInput').value='';try{sessionStorage.setItem('chiefKey',key);}catch{}
  connect();
});
$('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('connect').click();});
$('mode').addEventListener('change',()=>{$('agent').hidden=$('mode').value!=='command';});

function describeCommand(data){
  if(data.kind==='task')return `Task started for ${data.agentId||'an agent'}${data.task&&data.task.title?': '+data.task.title:''}.`;
  if(data.kind==='email')return `Email draft prepared for ${data.agentId||'an agent'}. It was not sent and needs your approval.`;
  const text=[data.reply,data.text,data.response,data.output,data.message].find(v=>typeof v==='string'&&v);
  return text||'Done.';
}
function describeError(status,data){
  if(status===429)return 'The Chief is at its limit of concurrent requests. Try again in a moment.';
  if(status===503&&data.code==='breaker-tripped')return 'Intake is stopped after repeated console failures. Use Resume work once the console is healthy.';
  if(status===503&&data.code==='runtime-draining')return 'Work is paused. Use Resume work to start new tasks.';
  if(status===502)return 'The console did not respond.';
  return data.message||data.code||`Request failed (${status}).`;
}
composer.addEventListener('submit',async event=>{
  event.preventDefault();
  const text=$('text').value.trim();
  if(!text||busy)return;
  busy=true;$('send').disabled=true;
  add(text,'user');$('text').value='';
  const pending=add('Working…','note');
  try{
    if($('mode').value==='chat'){
      history.push({role:'user',content:text});
      const {status,data}=await api('/intake/chat',{body:{messages:history.slice(-20)}});
      pending.remove();
      if(status===200&&data.ok!==false){
        const reply=data.reply||'No answer.';history.push({role:'assistant',content:reply});
        add(reply,'',data.model?`model: ${data.model}`:'');
        if(Array.isArray(data.proposals)&&data.proposals.length)add(`${data.proposals.length} suggested task${data.proposals.length>1?'s':''} proposed. Use "Assign as task / command" to start one.`,'note');
      }else{history.pop();add(describeError(status,data),'error');}
    }else{
      const body={command:text};const agent=$('agent').value.trim();if(agent)body.agentId=agent;
      const {status,data}=await api('/intake/command',{body});
      pending.remove();
      if(status<300&&data.ok!==false)add(describeCommand(data));else add(describeError(status,data),'error');
    }
  }catch{pending.remove();add('The Chief could not be reached.','error');}
  busy=false;$('send').disabled=false;$('text').focus();refresh();
});
$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();composer.requestSubmit();}});

$('pause').addEventListener('click',async()=>{
  const {status,data}=await api('/control/drain',{body:{}});
  add(status===200?'Pausing. Active work will finish first.':describeError(status,data),status===200?'note':'error');refresh();
});
$('resume').addEventListener('click',async()=>{
  if(!confirm('Resume work? Queued tasks will start.'))return;
  let result=await api('/control/resume',{body:{}});
  if(result.status===409&&result.data.code==='breaker-tripped'){
    if(!confirm('Intake was stopped after repeated console failures. Resume anyway?'))return;
    result=await api('/control/resume',{body:{acknowledgeBreaker:true}});
  }
  add(result.status===200?'Work resumed.':describeError(result.status,result.data),result.status===200?'note':'error');refresh();
});

if(key)connect();
</script>
</body>
</html>
